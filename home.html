<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Heroic Innovators School - Robot Maze Coding Game</title>
  <style>
    :root {
      --primary: #4A90E2;
      --secondary: #FF9F1C;
      --accent: #2EC4B6;
      --bg-dark: #1E1E2C;
      --panel-bg: #2D2D44;
      --text-light: #FFFFFF;
      --border-radius: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 15px;
    }

    h1 {
      margin: 0;
      color: var(--secondary);
      font-size: 2.2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    }

    .credits {
      margin-top: 5px;
      font-size: 1.1rem;
      color: var(--accent);
      font-weight: bold;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 900px;
      margin-bottom: 15px;
      background: var(--panel-bg);
      padding: 10px 20px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .level-select-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #FFD166;
    }

    .level-select-container select {
      background: #1E1E2C;
      color: #FFD166;
      border: 2px solid var(--primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .audio-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .audio-btn:hover {
      transform: scale(1.05);
      background: #357ABD;
    }

    .main-container {
      display: flex;
      gap: 20px;
      width: 900px;
    }

    /* Maze Grid Display */
    .maze-container {
      flex: 1;
      background: var(--panel-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #grid {
      display: grid;
      gap: 4px;
      background: #14141F;
      padding: 10px;
      border-radius: 8px;
      border: 3px solid var(--primary);
    }

    .cell {
      width: 60px;
      height: 60px;
      background: #3B3B58;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2rem;
      position: relative;
    }

    .cell.wall {
      background: #222230;
      box-shadow: inset 0 0 10px #000;
    }

    .cell.wall::after {
      content: '🧱';
      font-size: 1.5rem;
    }

    .cell.goal {
      background: #2A5235;
    }

    .cell.goal::after {
      content: '⭐';
      font-size: 1.8rem;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.9); }
      to { transform: scale(1.1); }
    }

    .robot {
      transition: all 0.3s ease;
      display: inline-block;
    }

    /* Controls Panel */
    .control-panel {
      width: 320px;
      background: var(--panel-bg);
      border-radius: var(--border-radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .command-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .cmd-btn {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }

    .cmd-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    #command-sequence {
      width: 100%;
      height: 100px;
      background: #1E1E2C;
      border: 2px solid var(--primary);
      border-radius: 8px;
      color: #00FFCC;
      font-family: monospace;
      padding: 10px;
      font-size: 0.95rem;
      resize: none;
    }

    .action-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .run-btn {
      flex: 2;
      background: #06D6A0;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .reset-btn {
      flex: 1;
      background: #FF9F1C;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .clear-btn {
      background: #EF476F;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Notification Banner */
    .status-banner {
      width: 900px;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: var(--border-radius);
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #252538;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .status-info { color: #4CC9F0; }
    .status-success { color: #06D6A0; }
    .status-error { color: #EF476F; }
  </style>
</head>
<body>

  <header>
    <h1> HEROIC INNOVATORS SCHOOL, MONIYA IBADAN </h1>
    <h2> Coding Class </h2>
    <div class="credits">Developed by Mr David (@david_thetechguy on TikTok)</div>
  </header>
  <div class="top-bar">
    <div class="level-select-container">
      <label for="level-select">Select Level:</label>
      <select id="level-select" onchange="changeLevel(this.value)">
        <option value="0">Level 1</option>
        <option value="1">Level 2</option>
        <option value="2">Level 3</option>
        <option value="3">Level 4</option>
        <option value="4">Level 5</option>
        <option value="5">Level 6</option>
        <option value="6">Level 7</option>
        <option value="7">Level 8</option>
      </select>
    </div>
    <button class="audio-btn" id="music-toggle" onclick="toggleMusic()">🔊 Music: OFF</button>
  </div>

  <div class="main-container">
    <div class="maze-container">
      <div id="grid"></div>
    </div>

    <div class="control-panel">
      <h3>Command Deck</h3>
      <div class="command-buttons">
        <button class="cmd-btn" onclick="addCommand('MOVE FORWARD')">⬆️ Move Forward</button>
        <button class="cmd-btn" onclick="addCommand('TURN LEFT')">↪️ Turn Left</button>
        <button class="cmd-btn" onclick="addCommand('TURN RIGHT')">↩️ Turn Right</button>
        <button class="cmd-btn" onclick="addCommand('MOVE 2 TIMES')">⏩ Move 2 Times</button>
        <button class="cmd-btn" onclick="addCommand('MOVE 3 TIMES')">⏭️ Move 3 Times</button>
      </div>

      <textarea id="command-sequence" readonly placeholder="Your code program will show here..."></textarea>

      <div class="action-btns">
        <div class="action-row">
          <button class="run-btn" onclick="runProgram()">▶️ Run Code</button>
          <button class="reset-btn" onclick="resetRobot()">🔄 Reset Robot</button>
        </div>
        <button class="clear-btn" onclick="clearCommands()">🗑️ Clear Commands</button>
      </div>
    </div>
  </div>

  <div class="status-banner" id="status-banner">
    <span class="status-info">Welcome Future Innovator! Select a level or program your robot to reach the star.</span>
  </div>

  <script>
    // Audio Context Synthesizer (No external sound files required)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let musicInterval = null;
    let isMusicOn = false;

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'move') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
      } else if (type === 'error') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(80, audioCtx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.25);
      } else if (type === 'victory') {
        let notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          let o = audioCtx.createOscillator();
          let g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
          g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.2);
          o.start(audioCtx.currentTime + idx * 0.1);
          o.stop(audioCtx.currentTime + idx * 0.1 + 0.2);
        });
      }
    }

    function toggleMusic() {
      isMusicOn = !isMusicOn;
      const btn = document.getElementById('music-toggle');
      if (isMusicOn) {
        btn.innerText = "🔊 Music: ON";
        let noteIndex = 0;
        const melody = [261.63, 329.63, 392.00, 329.63];
        musicInterval = setInterval(() => {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          let osc = audioCtx.createOscillator();
          let gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.frequency.value = melody[noteIndex % melody.length];
          gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
          noteIndex++;
        }, 500);
      } else {
        btn.innerText = "🔇 Music: OFF";
        clearInterval(musicInterval);
      }
    }

    // Encouragement Messages
    const praises = [
      "🌟 Great thinking, Young Genius!",
      "🚀 Excellent logic skills!",
      "🎉 You're coding like a pro!",
      "🧠 Heroic Innovator at work!",
      "🔥 Unstoppable problem solver!"
    ];

    // Level Designs (0: Empty, 1: Wall, 2: Start, 3: Goal)
    const levels = [
      { grid: [[2, 0, 0, 3]], dir: 1 },
      { grid: [[2, 0, 1],[1, 0, 0],[1, 1, 3]], dir: 1 },
      { grid: [[2, 0, 0, 0, 3]], dir: 1 },
      { grid: [[2, 1, 0],[0, 1, 0],[0, 0, 3]], dir: 2 },
      { grid: [[2, 0, 0],[1, 1, 0],[3, 0, 0]], dir: 1 },
      { grid: [[2, 0, 1, 0],[1, 0, 1, 0],[1, 0, 0, 3]], dir: 1 },
      { grid: [[1, 2, 1],[0, 0, 0],[0, 1, 0],[0, 0, 3]], dir: 2 },
      { grid: [[2, 0, 0, 0],[1, 1, 1, 0],[3, 0, 0, 0]], dir: 1 }
    ];

    let currentLevel = 0;
    let commands = [];
    let robotState = { x: 0, y: 0, dir: 1 };
    let isExecuting = false;

    function changeLevel(lvlIndex) {
      if (isExecuting) return;
      currentLevel = parseInt(lvlIndex);
      document.getElementById('level-select').value = currentLevel;
      initLevel();
    }

    function initLevel() {
      const level = levels[currentLevel];
      const gridEl = document.getElementById('grid');
      gridEl.innerHTML = '';
      
      const rows = level.grid.length;
      const cols = level.grid[0].length;
      gridEl.style.gridTemplateColumns = `repeat(${cols}, 60px)`;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          const val = level.grid[r][c];
          
          if (val === 1) cell.classList.add('wall');
          if (val === 3) cell.classList.add('goal');
          if (val === 2) {
            robotState = { x: c, y: r, dir: level.dir };
          }
          
          cell.id = `cell-${r}-${c}`;
          gridEl.appendChild(cell);
        }
      }
      renderRobot();
      clearCommands();
      showStatus(`Level ${currentLevel + 1} loaded. Program your robot to reach the star!`, "info");
    }

    function resetRobot() {
      if (isExecuting) return;
      const level = levels[currentLevel];
      for (let r = 0; r < level.grid.length; r++) {
        for (let c = 0; c < level.grid[0].length; c++) {
          if (level.grid[r][c] === 2) {
            robotState = { x: c, y: r, dir: level.dir };
          }
        }
      }
      renderRobot();
      showStatus("Robot reset back to starting position! Modify your commands and try again.", "info");
    }

    function renderRobot() {
      document.querySelectorAll('.robot').forEach(e => e.remove());

      const cell = document.getElementById(`cell-${robotState.y}-${robotState.x}`);
      if (!cell) return;
      
      const robotEl = document.createElement('span');
      robotEl.className = 'robot';
      robotEl.innerText = '🤖';
      
      const degrees = robotState.dir * 90;
      robotEl.style.transform = `rotate(${degrees}deg)`;
      
      cell.appendChild(robotEl);
    }

    function addCommand(cmd) {
      if (isExecuting) return;
      commands.push(cmd);
      updateCommandDisplay();
    }

    function clearCommands() {
      if (isExecuting) return;
      commands = [];
      updateCommandDisplay();
    }

    function updateCommandDisplay() {
      const txt = document.getElementById('command-sequence');
      txt.value = commands.map((c, i) => `${i + 1}. ${c}`).join('\n');
    }

    function showStatus(message, type) {
      const banner = document.getElementById('status-banner');
      banner.innerHTML = `<span class="status-${type}">${message}</span>`;
    }

    async function runProgram() {
      if (isExecuting || commands.length === 0) return;
      isExecuting = true;
      showStatus("🤖 Executing your code sequence...", "info");

      resetRobot(); // Start from initial level state

      const level = levels[currentLevel];
      const dx = [0, 1, 0, -1]; // N, E, S, W
      const dy = [-1, 0, 1, 0];

      for (let cmd of commands) {
        await new Promise(r => setTimeout(r, 400));

        let moveSteps = 0;
        if (cmd === 'MOVE FORWARD') moveSteps = 1;
        else if (cmd === 'MOVE 2 TIMES') moveSteps = 2;
        else if (cmd === 'MOVE 3 TIMES') moveSteps = 3;
        else if (cmd === 'TURN LEFT') {
          robotState.dir = (robotState.dir + 3) % 4;
          playSound('move');
          renderRobot();
        } else if (cmd === 'TURN RIGHT') {
          robotState.dir = (robotState.dir + 1) % 4;
          playSound('move');
          renderRobot();
        }

        for (let i = 0; i < moveSteps; i++) {
          let nextX = robotState.x + dx[robotState.dir];
          let nextY = robotState.y + dy[robotState.dir];

          if (
            nextY < 0 || nextY >= level.grid.length ||
            nextX < 0 || nextX >= level.grid[0].length ||
            level.grid[nextY][nextX] === 1
          ) {
            playSound('error');
            showStatus("⚠️ Error Command! The robot hit a wall. Click 'Reset Robot' or edit commands to try again!", "error");
            isExecuting = false;
            return;
          }

          robotState.x = nextX;
          robotState.y = nextY;
          playSound('move');
          renderRobot();
          await new Promise(r => setTimeout(r, 300));
        }
      }

      if (level.grid[robotState.y][robotState.x] === 3) {
        playSound('victory');
        const praise = praises[Math.floor(Math.random() * praises.length)];
        
        if (currentLevel < levels.length - 1) {
          showStatus(`🎉 ${praise} Moving to Level ${currentLevel + 2}...`, "success");
          setTimeout(() => {
            currentLevel++;
            document.getElementById('level-select').value = currentLevel;
            initLevel();
            isExecuting = false;
          }, 2000);
        } else {
          showStatus("🏆 CONGRATULATIONS! You completed all 8 levels of Heroic Innovators School Coding Game!", "success");
          isExecuting = false;
        }
      } else {
        playSound('error');
        showStatus("❌ Correct commands executed, but robot didn't reach the star! Click 'Reset Robot' and try again.", "error");
        isExecuting = false;
      }
    }

    window.onload = initLevel;
  </script>
</body>
</html>
